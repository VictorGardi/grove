# grove's tmux server config (-L grove). Changing an option later may need
# `tmux -L grove kill-server`, since source-file never unsets old options.
set -g status off
set -g mouse on
set -g history-limit 50000
set -g allow-passthrough on
set -g remain-on-exit failed
set -s escape-time 10
set -s focus-events on
# Mouse selections copy to the system clipboard: tmux emits OSC 52, which TerminalView writes to the clipboard.
set -g set-clipboard on
set -as terminal-features ',xterm*:clipboard'
# A drag keeps its highlight after copying (the default clears it and leaves copy mode); a click ends the selection.
bind -T copy-mode MouseDragEnd1Pane send -X copy-selection-no-clear
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-no-clear
bind -T copy-mode MouseDown1Pane select-pane \; send -X cancel
bind -T copy-mode-vi MouseDown1Pane select-pane \; send -X cancel
