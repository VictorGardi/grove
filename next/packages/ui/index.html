<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grove</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <section>
          <h2 class="section-label">Spaces</h2>
          <ul id="spaces" class="spaces"></ul>
          <form id="add-space" class="add-space">
            <input id="space-path" type="text" spellcheck="false" aria-label="Folder path" />
            <button type="submit">Add</button>
          </form>
        </section>
        <section class="agents-section">
          <h2 class="section-label">Agents</h2>
          <p id="agents-empty" class="empty">No agents yet.</p>
          <ul id="agents" class="agents"></ul>
        </section>
        <footer class="sidebar-foot">
          <a id="stress-link" href="./stress.html" hidden>Stress page</a>
        </footer>
      </aside>
      <main class="main">
        <div class="tabstrip">
          <div id="tabs" class="tabs" role="tablist"></div>
          <button id="grid-toggle" class="new-tab" type="button" aria-pressed="false" title="Show this space's tabs in a grid">grid</button>
          <button id="new-tab" class="new-tab" type="button" title="New shell tab">+</button>
          <button id="new-claude" class="new-tab" type="button" title="New Claude tab in this space">+ Claude</button>
          <button id="new-opencode" class="new-tab" type="button" title="New OpenCode tab in this space">+ OpenCode</button>
          <button id="new-copilot" class="new-tab" type="button" title="New Copilot tab in this space">+ Copilot</button>
        </div>
        <div id="terminals" class="terminals"></div>
        <div id="status" class="status" role="status"></div>
      </main>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
