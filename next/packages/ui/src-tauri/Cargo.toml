[package]
name = "grove-ui"
version = "0.1.0"
description = "Grove window: a Tauri shell around the core's JSON-RPC socket"
edition = "2021"
publish = false

[lib]
name = "grove_ui_lib"
path = "src/lib.rs"

[[bin]]
name = "grove-ui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.154"
tauri-plugin-notification = "2.8.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", features = ["NSWindow", "NSButton", "NSControl", "NSView", "NSResponder"] }
