name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    name: OSV scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan package-lock.json
        uses: google/osv-scanner-action/osv-scanner-action@v2.7.0
        with:
          scan-args: |-
            --config=osv-scanner.toml
            --lockfile=package-lock.json
